name: Build Yay VPN Windows test app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache: false
      - name: Compile Windows client
        shell: pwsh
        run: |
          dotnet publish windows/YayVpn/YayVpn.csproj -c Release -r win-x64 --self-contained true -o dist/YayVPN-Windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows client compilation failed' }
      - name: Build pinned native engine
        shell: pwsh
        run: |
          git clone --branch v1.12.12 --depth 1 https://github.com/SagerNet/sing-box.git .build/sing-box-windows
          if ($LASTEXITCODE -ne 0) { throw 'Engine source download failed' }
          $revision = git -C .build/sing-box-windows rev-parse HEAD
          if ($revision -ne '54ed58499d7063136ed52dabf87d179d252425d0') { throw 'Unexpected engine revision' }
          $output = Join-Path $PWD 'dist/YayVPN-Windows/engine'
          New-Item -ItemType Directory -Force $output | Out-Null
          Push-Location .build/sing-box-windows
          try {
            $env:CGO_ENABLED = '0'
            go build -trimpath -buildvcs=false -tags 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack' -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.12.12 -s -w -checklinkname=0' -o "$output/sing-box.exe" ./cmd/sing-box
            if ($LASTEXITCODE -ne 0) { throw 'Engine compilation failed' }
            go list -m all | Out-File -Encoding utf8 "$output/dependencies.txt"
          } finally { Pop-Location }
          & "$output/sing-box.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'Native engine cannot start' }
      - name: Package source and license information
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/YayVPN-Windows/
          Copy-Item third-party/sing-box-LICENSE.txt dist/YayVPN-Windows/engine/
          Copy-Item docs/WINDOWS-AND-APPLE.md dist/YayVPN-Windows/READ-ME.md
          git archive --format=zip --output=dist/YayVPN-Windows/YayVPN-corresponding-source.zip HEAD
          git -C .build/sing-box-windows archive --format=zip --output="$env:GITHUB_WORKSPACE/dist/YayVPN-Windows/engine/sing-box-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Yay-VPN-Windows-x64-test
          path: dist/YayVPN-Windows/
          if-no-files-found: error
          retention-days: 14
