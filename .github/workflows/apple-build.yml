name: Check Yay VPN Apple builds (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.10'
          cache: false
      - name: Install Xcode project generator
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Build pinned native framework
        run: bash scripts/build-apple-core.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec apple/project.yml
      - name: Compile iPhone and iPad targets
        run: |
          mkdir -p build-logs
          set -o pipefail
          xcodebuild -project apple/YayVPN.xcodeproj -scheme YayVPN-iOS -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath .build/apple-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-logs/apple-ios.log
      - name: Compile macOS targets
        run: |
          mkdir -p build-logs
          set -o pipefail
          xcodebuild -project apple/YayVPN.xcodeproj -scheme YayVPN-macOS -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath .build/apple-macos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-logs/apple-macos.log
      - name: Upload compile logs (not an installable app)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Yay-VPN-Apple-compile-logs
          path: build-logs/apple-*.log
          retention-days: 7
