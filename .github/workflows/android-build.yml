name: Build Yay VPN test APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'https://PROJECT_REF.supabase.co/functions/v1/yay-api (no trailing slash)'
        required: true
        default: 'https://vjcpphrhdzdywmrfndta.supabase.co/functions/v1/yay-api'
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YAY_API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.10'
          cache: false
      - name: Use Android SDK on the hosted runner
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Install Android dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - name: Build pinned native engine
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash scripts/build-core.sh
      - name: Build and lint Android
        run: gradle -p android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test backend security and API routes
        run: node --test tests/*.test.mjs
      - name: Upload test APK and lint report
        uses: actions/upload-artifact@v6
        with:
          name: Yay-VPN-test-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
